<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64" role="img" aria-label="Roam">
  <title>Roam</title>
  <defs>
    <linearGradient id="roam-bg" x1="8" y1="5" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".48" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#020409"/>
    </linearGradient>
    <radialGradient id="roam-halo" cx="32" cy="30" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#538EE7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#538EE7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roam-word" x1="78" y1="14" x2="176" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset=".42" stop-color="#8FB9F2"/>
      <stop offset="1" stop-color="#538EE7"/>
    </linearGradient>
    <linearGradient id="roam-rule" x1="78" y1="48" x2="184" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#538EE7"/>
      <stop offset="1" stop-color="#0F4089"/>
    </linearGradient>
    <filter id="roam-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <g>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#roam-bg)"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#roam-halo)"/>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#172033" stroke-width="1.4"/>

    <!-- 交织丝带：assets/logo-mobius.svg 原样等比缩放居中（132x188 → 30.9x44） -->
    <g filter="url(#roam-shadow)" transform="translate(16.55 10) scale(.234)">
      <g fill="#0F4089">
        <path d="M66 0 66 56 42 72 0 44Z"/>
        <path d="M90 72 132 100 108 116 66 88Z"/>
        <path d="M21 114 63 142 0 184 0 128Z"/>
      </g>
      <g fill="#538EE7">
        <path d="M66 0 132 44 132 100 90 72 66 56Z"/>
        <path d="M0 44 132 132 132 188 0 100Z"/>
      </g>
    </g>
  </g>

  <text x="78" y="41" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="32" font-weight="850" letter-spacing=".2" fill="url(#roam-word)">Roam</text>
  <text x="80" y="55" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="8.5" font-weight="800" letter-spacing="3.6" fill="#64748b">ANYWHERE · ANYTIME</text>
  <path d="M78 48H184" stroke="url(#roam-rule)" stroke-width="1.4" stroke-linecap="round" opacity=".38"/>
</svg>
