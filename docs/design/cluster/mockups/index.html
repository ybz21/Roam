<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roam 原型 · 多机（桌面）</title>
<style>
/* 多机原型 · 共享外壳样式 —— 对齐 2026-08 的真实界面（48 轨 / 顶栏 / 页头眉标 / 底栏四格）。
 *
 * 令牌直接取 frontend/src/theme.tsx 的真值，稿子和成品同源。原型只画壳与状态，
 * 不复刻每个组件的细节——看的是「多机这件事摆在哪」，不是像素级还原。 */
:root {
  --bg-base:#0d1117; --bg-container:#161b22; --bg-elevated:#1b222b; --bg-term:#06090d;
  --border:#30363d; --border-subtle:#21262d;
  --text-bright:#e6edf3; --text-dim:#8b949e; --text-dimmer:#6e7681;
  --accent:#58a6ff; --accent-solid:#1f6feb; --accent-soft:rgba(31,111,235,.14); --accent-border:rgba(88,166,255,.45);
  --ok:#3fb950; --ok-solid:#238636; --ok-soft:rgba(63,185,80,.14); --ok-border:rgba(63,185,80,.42);
  --danger:#f85149; --danger-soft:rgba(248,81,73,.12); --danger-border:rgba(248,81,73,.40);
  --warn:#d29922; --warn-soft:rgba(210,153,34,.12); --warn-border:rgba(210,153,34,.40);
  --swarm:#a371f7; --swarm-soft:rgba(163,113,247,.12); --swarm-border:rgba(163,113,247,.38);
  --list-hover:rgba(255,255,255,.025);
  --fs-micro:11px; --fs-meta:12px; --fs-sm:13px; --fs-body:14px; --fs-lg:16px; --fs-title:22px;
  --r-xs:6px; --r-sm:10px; --r-card:14px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rail:48px; --topbar:40px;
}
html[data-theme="light"] {
  --bg-base:#f6f8fa; --bg-container:#ffffff; --bg-elevated:#ffffff; --bg-term:#ffffff;
  --border:#d0d7de; --border-subtle:#e6e9ec;
  --text-bright:#1f2328; --text-dim:#57606a; --text-dimmer:#8c959f;
  --accent:#0969da; --accent-solid:#1f6feb; --accent-soft:rgba(31,111,235,.10); --accent-border:rgba(31,111,235,.40);
  --ok:#1a7f37; --ok-solid:#1f883d; --ok-soft:rgba(31,136,61,.10); --ok-border:rgba(31,136,61,.40);
  --danger:#cf222e; --danger-soft:rgba(207,34,46,.09); --danger-border:rgba(207,34,46,.35);
  --warn:#9a6700; --warn-soft:rgba(154,103,0,.10); --warn-border:rgba(154,103,0,.35);
  --list-hover:rgba(27,31,36,.04);
}
* { box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }  /* 文档永不滚动：每一页在自己的容器里滚 */
body { margin:0; background:var(--bg-base); color:var(--text-bright);
  font:var(--fs-body)/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; }
svg { display:block; } button { font:inherit; cursor:pointer; color:inherit; }
a { color:inherit; text-decoration:none; }

/* ══ 外壳骨架 ═══════════════════════════════════════════════════ */
.app { display:flex; height:100dvh; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }

/* 侧栏：48 轨（今天的默认）。展开态 224 只在原型里当对照 */
.nav { width:var(--rail); flex:0 0 var(--rail); display:flex; flex-direction:column; align-items:center;
  padding:6px 0; gap:4px; border-right:1px solid var(--border-subtle); background:var(--bg-base); }
.nav .brand { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#1f6feb,#3fb950); margin:3px 0 6px; }
.nav a.it { width:34px; height:34px; border-radius:8px; display:grid; place-items:center; color:var(--text-dimmer); position:relative; }
.nav a.it:hover { background:var(--list-hover); color:var(--text-dim); }
.nav a.it.on { color:var(--accent); background:var(--accent-soft); }
.nav a.it.on::before { content:""; position:absolute; left:-7px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent); }
.nav .sp { flex:1; }
.nav .sep { width:24px; height:1px; background:var(--border-subtle); margin:4px 0; }
/* 底座那枚 = 机器切换器。单机时它是主机图标 + 「当前设备」，多机时换成方章 + 状态点 */
.nav .node { position:relative; width:34px; height:34px; border-radius:8px; background:var(--bg-elevated);
  display:grid; place-items:center; border:0; }
.nav .node .d { position:absolute; right:1px; bottom:1px; width:7px; height:7px; border-radius:50%;
  box-shadow:0 0 0 2px var(--bg-base); }

/* 顶栏 */
.top { height:var(--topbar); flex:0 0 var(--topbar); display:flex; align-items:center; gap:8px; padding:0 10px;
  border-bottom:1px solid var(--border-subtle); }
.top .search { flex:0 1 360px; height:26px; border-radius:var(--r-xs); background:var(--bg-elevated);
  display:flex; align-items:center; gap:6px; padding:0 9px; color:var(--text-dimmer); font-size:var(--fs-micro); }
.top .search kbd { margin-left:auto; font:var(--fs-micro)/1 var(--mono); border:1px solid var(--border);
  border-radius:4px; padding:2px 5px; }
.top .grow { flex:1; }
.top .cbtn { height:26px; padding:0 10px; border-radius:var(--r-xs); background:var(--accent-solid); color:#fff;
  display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-micro); border:0; }
.top .link { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-micro); color:var(--text-dim); }

/* 内容区：唯一滚动的地方 */
.page { flex:1; min-height:0; overflow:auto; padding:16px; }

/* 页头（.tt-pagehead）：眉标行就是机器面包屑 */
.head { margin-bottom:14px; }
.head .kick { display:flex; align-items:center; gap:7px; font-size:var(--fs-micro); letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-dimmer); margin-bottom:5px; }
.head h1 { margin:0; font-size:var(--fs-title); font-weight:600; }
.head p { margin:4px 0 0; font-size:var(--fs-meta); color:var(--text-dim); }
.head .acts { float:right; display:flex; gap:8px; }
/* 机器身份**不进页头**：轨是常驻的，页面里再写一遍是把同一件事说七遍。
   .crumb 只剩两处还在用——手机底栏那一格，以及降级时的提示条。 */
.crumb { display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 4px;
  border:1px solid var(--border-subtle); border-radius:var(--r-pill);
  color:var(--text-dim); letter-spacing:0; text-transform:none; font-size:var(--fs-micro); }
.crumb.warn { border-color:var(--warn-border); background:var(--warn-soft); color:var(--warn); }
/* 中心那一行：它不是机器，给它自己的一段 */
.picker .row.hub .nm { font-weight:600; }

/* ══ 机器徽记：一个汉字或两个字母的方章 + 三态点 ═══════════════════
   机器**不发色**——色板已经排到第五支（蜂群紫），再给每台机器一支，
   一枚标签上就会同时挂机器色/状态色/蜂群色，没人分得清哪个说的是哪件事。 */
.nmk { display:inline-grid; place-items:center; flex:0 0 auto; width:20px; height:20px; border-radius:var(--r-xs);
  border:1px solid var(--border); background:var(--bg-elevated); font:600 9px/1 var(--mono);
  color:var(--text-dim); white-space:nowrap; overflow:hidden; }
.nmk[data-cjk] { font:600 12px/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.nmk.sm { width:16px; height:16px; border-radius:5px; font-size:8px; }
.nmk.sm[data-cjk] { font-size:10px; }
.nmk.lg { width:28px; height:28px; font-size:12px; }
.nmk.lg[data-cjk] { font-size:17px; }
.nmk.cur { color:var(--accent); border-color:var(--accent-border); background:var(--accent-soft); }
.nmk.off { color:var(--text-dimmer); border-style:dashed; background:transparent; }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); flex:0 0 auto; }
.dot.lag { background:var(--warn); } .dot.off { background:var(--text-dimmer); } .dot.bad { background:var(--danger); }

/* ══ 机器选择弹层：复用 ⌘K 面板的列表语言，不是第二套下拉 ═══════ */
.picker { position:fixed; left:56px; bottom:12px; width:296px; z-index:50;
  border:1px solid var(--border); border-radius:var(--r-card); background:var(--bg-elevated);
  box-shadow:0 20px 48px rgba(1,4,9,.55); overflow:hidden; }
html[data-theme="light"] .picker { box-shadow:0 20px 48px rgba(140,149,159,.28); }
.picker.hide { display:none; }
.picker .hd { padding:9px 12px; border-bottom:1px solid var(--border-subtle); color:var(--text-dimmer); font-size:var(--fs-meta); }
.picker .gl { padding:8px 12px 4px; font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--text-dimmer); }
.picker .row { display:flex; align-items:center; gap:9px; width:100%; padding:7px 12px; font-size:var(--fs-meta);
  color:var(--text-dim); background:none; border:0; text-align:left; }
.picker .row:hover { background:var(--list-hover); }
.picker .row .nm { flex:1; min-width:0; color:var(--text-bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.picker .row .mt { font-family:var(--mono); font-size:var(--fs-micro); color:var(--text-dimmer); }
.picker .row.cur { background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent); }
.picker .row.off { opacity:.5; }
.picker .ft { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--border-subtle); }

/* ══ 通用零件 ═══════════════════════════════════════════════════ */
.card { border:1px solid var(--border); border-radius:var(--r-card); background:var(--bg-container); }
.card > .hd { padding:11px 15px; border-bottom:1px solid var(--border-subtle); font-size:var(--fs-sm);
  font-weight:600; display:flex; align-items:center; gap:8px; }
.card > .hd .sp { flex:1; }
.card > .bd { padding:14px 15px; display:flex; flex-direction:column; gap:var(--sp-3); }
.act { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border:1px solid var(--border);
  border-radius:var(--r-xs); background:transparent; color:var(--text-dim); font-size:var(--fs-micro); }
.act:hover { color:var(--text-bright); border-color:var(--accent-border); }
.act.pri { background:var(--accent-solid); border-color:transparent; color:#fff; }
.act.danger { color:var(--danger); border-color:var(--danger-border); }
.pill { font-size:var(--fs-micro); padding:1px 8px; border-radius:var(--r-pill); border:1px solid var(--border);
  color:var(--text-dimmer); white-space:nowrap; }
.pill.ok { color:var(--ok); border-color:var(--ok-border); background:var(--ok-soft); }
.pill.warn { color:var(--warn); border-color:var(--warn-border); background:var(--warn-soft); }
.pill.acc { color:var(--accent); border-color:var(--accent-border); background:var(--accent-soft); }
.note { border-left:2px solid var(--accent); background:var(--accent-soft); padding:9px 13px;
  border-radius:0 var(--r-xs) var(--r-xs) 0; color:var(--text-dim); font-size:var(--fs-meta); line-height:1.8; }
.note b { color:var(--text-bright); }
.note.warn { border-left-color:var(--warn); background:var(--warn-soft); }
.note.ok { border-left-color:var(--ok); background:var(--ok-soft); }
.mono { font-family:var(--mono); font-size:var(--fs-micro); }
.seclbl { display:flex; align-items:center; gap:8px; margin:0 0 9px; font-size:var(--fs-meta);
  font-weight:600; color:var(--text-bright); }
.seclbl .sc { display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-micro); font-weight:400;
  color:var(--text-dimmer); border:1px solid var(--border); border-radius:var(--r-pill); padding:1px 8px; }
.grid { display:grid; gap:var(--sp-3); }
.empty { padding:40px 0; text-align:center; color:var(--text-dimmer); font-size:var(--fs-meta); }

/* 终端坞（桌面右侧）：标签带方章，切机器不关它们 */
.dock { width:300px; flex:0 0 300px; border-left:1px solid var(--border-subtle); background:var(--bg-term);
  display:flex; flex-direction:column; }
.dock .tabs { display:flex; overflow:hidden; background:var(--bg-container); border-bottom:1px solid var(--border-subtle); }
.dock .tab { display:flex; align-items:center; gap:6px; padding:7px 10px; font-size:var(--fs-meta);
  color:var(--text-dim); border-right:1px solid var(--border-subtle); white-space:nowrap; }
.dock .tab.on { background:var(--bg-term); color:var(--text-bright); box-shadow:inset 0 -2px 0 var(--accent); }
.dock .tab .pj { color:var(--text-dimmer); }
.dock .st { display:flex; align-items:center; gap:7px; padding:6px 10px; font-size:var(--fs-micro);
  color:var(--text-dim); border-bottom:1px solid var(--border-subtle); }
.dock .body { flex:1; padding:10px; font:var(--fs-micro)/1.7 var(--mono); color:var(--text-dimmer); overflow:auto; }

/* 手机机身（mobile.html 用） */
.phones { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; }
.phone { width:320px; border:8px solid #1b222b; border-radius:30px; overflow:hidden; background:var(--bg-base);
  box-shadow:0 18px 48px rgba(1,4,9,.5); }
html[data-theme="light"] .phone { border-color:#c9d1d9; box-shadow:0 18px 48px rgba(140,149,159,.28); }
.phone .notch { height:20px; background:var(--bg-container); display:grid; place-items:center; }
.phone .notch i { width:60px; height:5px; border-radius:var(--r-pill); background:var(--border); display:block; }
.phone .stage { height:420px; display:flex; flex-direction:column; min-height:0; }
.phone .pbody { flex:1; min-height:0; overflow:hidden; padding:10px; display:flex; flex-direction:column; gap:8px; }
.phone .sessdock { display:flex; align-items:center; gap:7px; padding:8px 10px; border-top:1px solid var(--border);
  background:var(--bg-container); font-size:var(--fs-meta); color:var(--text-bright); }
.phone .bnav { display:flex; border-top:1px solid var(--border); background:var(--bg-container); }
.phone .bnav span { flex:1; text-align:center; padding:6px 0 8px; font-size:9px; color:var(--text-dimmer); }
.phone .bnav span.on { color:var(--accent); }
.phone .bnav i { display:block; margin:0 auto 3px; width:15px; height:15px; border-radius:4px; border:1.5px solid currentColor; }
.phonetag { text-align:center; margin-top:8px; font-size:var(--fs-meta); color:var(--text-dim); }
.phonetag b { color:var(--text-bright); }

/* 原型自己的横幅：说明这是稿子不是产品 */
.protobar { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--accent-soft);
  border-bottom:1px solid var(--accent-border); font-size:var(--fs-micro); color:var(--text-dim); }
.protobar b { color:var(--text-bright); }
.protobar .sp { flex:1; }
.protobar a { color:var(--accent); }

</style>
</head>
<body></body>
<script>
// 多机原型 · 共享外壳。每页只写内容，壳（轨导航 / 顶栏 / 页头眉标 / 机器切换器）由这里渲染。
//
// 三件事和真实应用同构，别的都可以糊：
//   ① 当前机器跨页保持（localStorage），切一下所有页面跟着换 —— 这就是 currentNodeId
//   ② 机器身份 = 方章（一个汉字或两个字母），不发颜色；状态才用颜色
//   ③ 终端标签钉在各自机器上，切机器不关它们
(function () {
  var NODES = [
    { id: 'n_ws',  name: '公司工作站', host: 'dev-ws-01', os: 'Linux', ver: 'v0.1.0-rc.2', group: '工作',
      latency: 12, sessions: 3, load: 0.7, online: true },
    { id: 'n_home', name: '家里台式机', host: 'home-pc', os: 'Linux', ver: 'v0.1.0-rc.2', group: '家',
      latency: 45, sessions: 1, load: 0.2, online: true },
    { id: 'n_gpu', name: '云 GPU 机', host: 'gpu-box', os: 'Linux', ver: 'v0.1.0-rc.1', group: '工作',
      latency: 210, sessions: 2, load: 3.1, online: true },
    { id: 'n_pi',  name: '树莓派', host: 'rpi4', os: 'Linux', ver: 'v0.1.0-rc.1', group: '家',
      latency: 0, sessions: 0, load: 0, online: false }
  ];
  var HUB = 'https://roam.example.com';
  var KEY = 'roam.proto.node';

  // 中文名取首字，拉丁名取两个首字母（gpu-box → GB）。两个汉字在 16px 的格子里会换行——
  // 这是画出来才发现的，不是拍脑袋定的。
  function markText(name) {
    var s = (name || '?').trim();
    if (/^[一-龥]/.test(s)) return s[0];
    var parts = s.split(/[^A-Za-z0-9]+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return s.slice(0, 2).toUpperCase();
  }
  function mark(node, size, cur) {
    var t = markText(node.name);
    var cjk = /[一-龥]/.test(t) ? ' data-cjk' : '';
    return '<span class="nmk' + (size ? ' ' + size : '') + (cur ? ' cur' : '') +
      (node.online ? '' : ' off') + '"' + cjk + ' aria-hidden="true">' + t + '</span>';
  }
  function dotCls(node) {
    if (!node.online) return 'dot off';
    return node.latency > 150 ? 'dot lag' : 'dot';
  }

  // 中心也是一个「能切过去的地方」，所以它和机器共用同一个当前值。
  var HUBNODE = { id: 'hub', name: '中心', host: 'roam.example.com', online: true, latency: 0, isHub: true };
  var current = null;
  function cur() {
    if (!current) {
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) {}
      if (saved === 'hub') current = HUBNODE;
      else current = NODES.filter(function (n) { return n.id === saved && n.online; })[0] || NODES[0];
    }
    return current;
  }
  function setCur(id) {
    var n = id === 'hub' ? HUBNODE : NODES.filter(function (x) { return x.id === id; })[0];
    if (!n || !n.online) return;
    current = n;
    try { localStorage.setItem(KEY, id); } catch (e) {}
    Proto.render(); // 切机器 = 换浏览范围。原型里就地重画，等价于实现里的整页 reload
  }

  var ICONS = {
    projects: '<path d="M3 10.2 12 3l9 7.2"/><path d="M5.5 9v11h13V9"/><path d="M9.5 20v-5h5v5"/>',
    sessions: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="14" y1="4" x2="14" y2="20"/>',
    files: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    browser: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/>',
    phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.5h2"/>',
    nodes: '<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>',
    settings: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>'
  };
  // 全部页面在同一个文件里，轨点一下就地换内容——原型不该为了「像多页」而拆成十个文件。
  var PAGES = [
    { key: 'projects', label: '工作台' },
    { key: 'files', label: '文件' },
    { key: 'sessions', label: '会话' },
    { key: 'browser', label: '浏览器' },
    { key: 'phone', label: '手机' },
    { key: 'nodes', label: '机器' }
  ];
  function svg(d, size) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) +
      '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  }

  function railHTML(active) {
    var n = cur();
    var items = PAGES.map(function (p) {
      return '<a class="it' + (p.key === active ? ' on' : '') + '" href="#' + p.key + '" title="' + p.label + '">' +
        svg(ICONS[p.key]) + '</a>';
    }).join('');
    return '<nav class="nav">' +
      '<a class="brand" href="#projects" title="回工作台"></a>' + items +
      '<div class="sp"></div>' +
      '<a class="it' + (active === 'settings' ? ' on' : '') + '" href="#settings" title="设置">' + svg(ICONS.settings) + '</a>' +
      '<div class="sep"></div>' +
      // **全站唯一的切换入口**。它本来说的就是「你连着的这台机器」，多机后终于有了名字；
      // 列表里第一项是中心自己，所以「切到哪里」这件事从头到尾只有这一个地方
      '<button class="node" onclick="Proto.togglePicker(event)" aria-label="切换，当前 ' + n.name + '" title="' +
        n.name + (n.isHub ? '' : ' · ' + n.latency + 'ms') + '">' +
        (n.isHub ? '<span class="nmk sm cur" aria-hidden="true">中</span>' : mark(n, 'sm', true)) +
        '<i class="' + dotCls(n) + '"></i></button>' +
      '</nav>';
  }

  function pickerHTML() {
    var c = cur();
    // 中心自己也在这张列表里。它不是一台「机器」（没有终端和文件），但它是一个
    // **能被切过去看的地方**——机器名单、接入、中心自己的设置都在那儿。
    // 不给它一个位置，用户在中心的控制台里就永远够不到中心本身。
    var hubRow = '<button class="row hub' + (c.id === 'hub' ? ' cur' : '') + '" onclick="Proto.setNode(\'hub\')">' +
      '<span class="nmk cur" aria-hidden="true">中</span>' +
      '<span class="nm">中心</span>' +
      '<span class="mt">3 台在线</span><i class="dot"></i></button>';
    var rows = NODES.map(function (n) {
      return '<button class="row' + (n.id === c.id ? ' cur' : '') + (n.online ? '' : ' off') + '"' +
        (n.online ? ' onclick="Proto.setNode(\'' + n.id + '\')"' : ' disabled') + '>' +
        mark(n, null, n.id === c.id) +
        '<span class="nm">' + n.name + '</span>' +
        '<span class="mt">' + (n.online ? n.latency + 'ms' : '离线') + '</span>' +
        '<i class="' + dotCls(n) + '"></i></button>';
    }).join('');
    return '<div class="picker hide" id="picker">' +
      '<div class="hd">切到哪里</div>' +
      '<div class="gl">中心</div>' + hubRow +
      '<div class="gl">机器 · ' + NODES.length + '</div>' + rows +
      '<div class="ft"><a class="act" href="#nodes">＋ 添加机器</a></div></div>';
  }

  function topHTML() {
    return '<div class="top">' +
      '<div class="search">' + svg('<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>', 13) +
      '搜索项目、会话和文件<kbd>Ctrl+K</kbd></div>' +
      '<span class="grow"></span>' +
      '<span class="link"><i class="dot"></i>在线</span>' +
      '<button class="cbtn">＋ 新建</button></div>';
  }

  /**
   * 页头。**不放机器身份**——眉标就是原来的分组名。
   *
   * 「我在哪台机器」只由侧栏底座那一处回答，切换也在那一处。之前每页都挂一枚芯片，
   * 等于把同一件事说七遍：轨是常驻的，它本来就一直在屏幕上，页面里再写一遍纯属噪音，
   * 而且用户还得判断这两处是不是一回事。
   *
   * 误操作的防线不靠这种被动提示，靠<b>动作发生时</b>把机器名写进确认框
   * （「在 云 GPU 机 上删除 3 个文件？」）——那才是真拦得住的地方。
   */
  function head(o) {
    return '<div class="head">' +
      (o.acts ? '<div class="acts">' + o.acts + '</div>' : '') +
      (o.kicker ? '<div class="kick"><span>' + o.kicker + '</span></div>' : '') +
      '<h1>' + o.title + '</h1>' + (o.desc ? '<p>' + o.desc + '</p>' : '') + '</div>';
  }

  /** 终端坞：标签各自钉在自己的机器上，切机器不关它们——那是正在跑的活。 */
  function dockHTML() {
    return '<aside class="dock">' +
      '<div class="tabs">' +
      '<div class="tab on">' + mark(NODES[0], 'sm', cur().id === 'n_ws') + '<span class="pj">roam ·</span>build</div>' +
      '<div class="tab">' + mark(NODES[2], 'sm', cur().id === 'n_gpu') + '<span class="pj">nn ·</span>train</div>' +
      '</div>' +
      '<div class="st"><i class="dot"></i>公司工作站 · roam · build<span style="flex:1"></span>已连接 · 12ms</div>' +
      '<div class="body">$ npm run build<br>vite v5 building…<br>✓ built in 37.2s</div></aside>';
  }

  function protobar(where) {
    return '<div class="protobar"><b>原型</b>· 多机（2026-08 版）· 当前页：' + where +
      '<span class="sp"></span>' +
      '<a href="#" onclick="Proto.theme();return false" style="margin-left:12px">切换深浅</a></div>';
  }

  window.Proto = {
    nodes: NODES, hub: HUB, cur: cur, mark: mark, dotCls: dotCls, svg: svg, head: head,
    setNode: setCur,
    togglePicker: function (e) { e.stopPropagation(); document.getElementById('picker').classList.toggle('hide'); },
    theme: function () {
      var light = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', light ? 'dark' : 'light');
    },
    /** 按 hash 渲染整屏。切页、切机器都走它——原型里没有真正的路由，也不需要。 */
    render: function () {
      var key = (location.hash || '#projects').slice(1);
      if (!PAGES.concat([{ key: 'settings' }]).some(function (p) { return p.key === key; })) key = 'projects';
      var meta = PAGES.concat([{ key: 'settings', label: '设置 › 多机' }])
        .filter(function (p) { return p.key === key; })[0];
      var withDock = key === 'projects' || key === 'files' || key === 'sessions';
      document.body.innerHTML =
        '<div class="app">' + railHTML(key) +
        '<div class="main">' + protobar(meta.label) + topHTML() +
        '<div style="flex:1;min-height:0;display:flex">' +
        '<div class="page">' + window.PAGE_HTML[key]() + '</div>' +
        (withDock ? dockHTML() : '') +
        '</div></div></div>' + pickerHTML();
    }
  };
})();

</script>
